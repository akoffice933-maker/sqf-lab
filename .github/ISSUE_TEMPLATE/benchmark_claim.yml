name: Benchmark claim / disagreement
description: You measured something different from docs/BENCHMARKS.md
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        This template enforces the repository's bar: blind input, in-loop counters,
        verification outside the solver, raw JSON attached.
  - type: input
    id: row
    attributes: { label: Which published row do you disagree with? }
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Exact command line
      render: shell
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "CPU, cores, RAM, compiler + flags, NATIVE=0/1, Python version"
    validations: { required: true }
  - type: checkboxes
    id: rules
    attributes:
      label: Methodology
      options:
        - label: The secret key was generated by the harness and never passed to the solver
          required: true
        - label: Operation counts are incremented inside the loop (no formula)
          required: true
        - label: The recovered key was verified outside the solver
          required: true
